<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agapic Chants · Live</title>
<link rel="stylesheet" href="/fonts/jost.css">
<style>
  :root{
    --cream:#f4e7d4; --card:#fbf3e8; --terra:#d2684f; --terra-dark:#b04c35; --terra-deeper:#8f3a27;
    --ink:#2a1f14; --ink-soft:#5a4535; --rule:rgba(210,104,79,0.2); --field:rgba(176,76,53,0.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,Futura,'Century Gothic',sans-serif;font-size:17px;line-height:1.5}
  a{color:var(--terra-dark)} a:hover{color:var(--terra-deeper)}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
  header .logo{grid-column:2}
  header img{width:120px;height:120px;display:block}
  header .lang{grid-column:3;justify-self:end}
  .lang{height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--field);background:transparent;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
  .eyebrow{font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-dark);margin:28px 0 8px}
  h1{margin:0 0 10px;font-weight:500;font-size:clamp(32px,8vw,44px);line-height:1.05}
  h2{margin:0 0 10px;font-weight:500;font-size:24px;line-height:1.15}
  .meta{margin-top:16px} .meta b{font-weight:600} .meta .times{margin:2px 0 10px} .meta .times div{line-height:1.45}
  .card{margin-top:18px;padding:20px;background:var(--card);border:1px solid var(--rule);border-radius:16px}
  .card p{margin:0 0 10px} .card p:last-child{margin:0}
  .progress{margin-top:18px;padding:20px;background:var(--ink);color:var(--cream);border-radius:16px}
  .progress .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .bar{height:12px;background:var(--ink-soft);border-radius:999px;overflow:hidden;margin:10px 0}
  .bar span{display:block;height:100%;width:0;background:var(--terra);border-radius:999px;transition:width .6s}
  section{margin-top:32px}
  .tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .tier{min-height:78px;padding:12px;border-radius:14px;text-align:left;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid rgba(210,104,79,.25)}
  .tier strong{display:block;font-size:24px;font-weight:500}
  .tier span{display:block;font-size:14px}
  .tier[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500;margin-top:14px}
  input[type=text],input[type=email],input[type=number]{height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 14px;font:inherit;font-weight:400;background:var(--card);color:var(--ink)}
  textarea{border:1.5px solid var(--field);border-radius:12px;padding:10px 14px;font:inherit;font-weight:400;background:var(--card);color:var(--ink);resize:vertical}
  input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
  .impact{margin-top:14px;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
  .optin{margin-top:16px;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
  .optin .check{flex-direction:row;align-items:flex-start;gap:10px;font-weight:400;margin:0}
  .optin .check input{width:22px;height:22px;margin:2px 0 0;flex-shrink:0}
  .optin label.city{font-size:14px;color:var(--ink-soft);font-weight:400}
  .cta{margin-top:20px;width:100%;height:56px;border:none;border-radius:14px;background:var(--terra-dark);color:#fff;font:inherit;font-size:18px;font-weight:500;cursor:pointer}
  .cta:hover{background:var(--terra-deeper)} .cta[disabled]{opacity:.6;cursor:wait}
  .note{font-size:14px;color:var(--ink-soft);text-align:center;margin:10px 0 0}
  .error{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f6d6cc;color:#5c1f12;display:none}
  .small{font-size:15px;color:var(--ink-soft)} .small b{color:var(--ink);font-weight:600}
  .list a{display:block;padding:16px;margin-top:10px;background:var(--card);border:1px solid var(--rule);border-radius:14px;text-decoration:none;color:var(--ink)}
  .list a b{font-weight:600}
  .video-btn{margin-top:12px;height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--field);background:transparent;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
  .explainer{display:block;width:100%;max-width:200px;aspect-ratio:9/16;margin:0 auto 18px;border-radius:14px;background:#000}
  .share-btn{margin-top:14px;height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--field);background:transparent;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
  .left{margin:6px 0 0;color:var(--terra-deeper);font-weight:500}
  footer{max-width:560px;margin:0 auto;padding:16px 16px 40px;font-size:14px;color:var(--ink-soft);display:flex;gap:16px}
  footer a{color:var(--ink-soft)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="/"><img src="/images/agapic-chants-logo.png" alt="Agapic Chants"></a>
    <button class="lang" id="langBtn" type="button"></button>
  </header>

  <!-- Shown when no event is chosen: list of upcoming evenings -->
  <main id="list" hidden>
    <p class="eyebrow" data-i="listEyebrow"></p>
    <h1 data-i="listTitle"></h1>
    <div class="list" id="listItems"></div>
  </main>

  <!-- One event -->
  <main id="event" hidden>
    <h1 id="title" style="margin-top:24px"></h1>
    <p id="blurb" style="margin:0"></p>
    <p id="hosts" hidden style="margin:6px 0 0;color:var(--ink-soft)"></p>
    <div class="meta">
      <b id="date"></b>
      <div class="times" id="times"></div>
      <div id="place"></div>
    </div>
    <p id="seatsLeft" class="left" hidden></p>

    <div class="card">
      <video class="explainer" id="explainer" controls playsinline preload="metadata"></video>
      <h2 data-i="paidTitle"></h2>
      <p data-i="paidP1"></p>
      <p><span data-i="paidP2"></span> <span id="costline"></span></p>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="row"><span style="font-weight:500" data-i="progLabel"></span><span id="progText" style="white-space:nowrap"></span></div>
      <div class="bar"><span id="progBar"></span></div>
      <span id="progFunded" style="font-size:15px"></span>
    </div>

    <form id="form" novalidate>
      <section>
        <h2 data-i="chooseH"></h2>
        <div class="tiers" id="tiers"></div>
        <label><span data-i="own"></span>
          <input type="number" id="custom" min="0" step="1" inputmode="numeric" placeholder="€">
        </label>
        <div class="impact" id="impact"></div>
      </section>

      <section>
        <h2 id="detailsHead"></h2>
        <label><span id="nameLabel"></span> <input type="text" id="name" autocomplete="name" required></label>
        <label><span id="emailLabel"></span> <input type="email" id="email" autocomplete="email" required></label>
        <label id="spotsRow"><span data-i="spots"></span> <input type="number" id="spots" value="1" min="1"></label>
        <div id="giftFields" hidden>
          <label><span data-i="fromName"></span> <input type="text" id="fromName" autocomplete="name"></label>
          <label><span data-i="fromEmail"></span> <input type="email" id="fromEmail" autocomplete="email"></label>
          <label><span data-i="giftNote"></span> <textarea id="note" maxlength="300" rows="3"></textarea></label>
        </div>
        <div class="error" id="error" role="alert"></div>
        <button class="cta" id="cta" type="submit"></button>
        <p class="note" id="ctaNote"></p>
        <div style="text-align:center"><button class="share-btn" id="shareBtn" type="button" data-i="share"></button></div>
      </section>
    </form>

    <section id="waitBox" hidden>
      <h2 data-i="waitH"></h2>
      <p data-i="waitP" style="margin:0"></p>
      <label><span data-i="name"></span><input type="text" id="wName" autocomplete="name"></label>
      <label><span data-i="email"></span><input type="email" id="wEmail" autocomplete="email"></label>
      <div class="error" id="wError" role="alert"></div>
      <button class="cta" id="wBtn" type="button" data-i="waitBtn"></button>
      <p class="impact" id="wDone" hidden data-i="waitDone"></p>
    </section>

    <section class="small">
      <p><b data-i="backH"></b> <span data-i="backP"></span></p>
      <p><b data-i="giveH"></b> <a id="giveLink" href="/live/give.html" data-i="giveLink"></a></p>
      <p data-i="notTax"></p>
    </section>
  </main>

  <main id="missing" hidden>
    <h1 style="margin-top:28px" data-i="missingH"></h1>
    <p><a href="/live/event.html" data-i="missingLink"></a></p>
  </main>
</div>
<footer><a href="/impressum.html">Impressum</a><a href="/datenschutz.html">Datenschutz</a></footer>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const T = {
    en: {
      other: 'Deutsch', listEyebrow: 'Upcoming evenings', listTitle: 'Come sing with us', listEmpty: 'No evenings are open right now. Check back soon.',
      eyebrow: 'Communal chant evening', hosted: (c) => `Hosted by Nathan & ${c}`, times: (d, s) => `doors ${d}, singing ${s}`, tDoors: 'Doors open', tStart: 'Singing starts', tEnd: 'Ends around', mapsTitle: 'Open in maps',
      paidTitle: 'Tonight is already paid for.',
      videoBtn: '▶ Watch how it works (about a minute)',
      paidP1: 'People who came before you gave so this evening could be free for you. If money is tight right now, reserve your spot and come. You’re welcome as you are, and you don’t need to explain anything.',
      paidP2: 'If you have some to spare, your contribution keeps it going.',
      cost1: (c) => `Every €${c} covers one 3.5-hour session at the `, clinic: 'Wolfgarten clinic',
      cost2: ' in Bonn, where I keep women company during their chemotherapy infusions with songs and conversation. That includes my preparation, travel and payment fees.',
      progLabel: 'Next clinic session', progText: (r, c) => `€${r} of €${c}`,
      funded: (n) => n === 1 ? '1 session funded so far by people like you.' : `${n} sessions funded so far by people like you.`,
      firstFilling: 'The first session is filling up now.',
      chooseH: 'Choose what fits', own: 'Or your own amount (€)',
      detailsH: 'Where should I send your ticket?', giftH: 'Who are you saving a seat for?',
      name: 'Your name', email: 'Email', theirName: 'Their name', theirEmail: 'Their email (their ticket goes here)',
      spots: 'How many spots?', fromName: 'Your name', fromEmail: 'Your email (for your receipt)', giftNote: 'A note for them (optional)',
      optin: 'Let me know when an evening like this comes near me', optinPaid: ', and when the session I helped fund happens', city: 'City or postal code (optional)',
      tFree: 'Reserve my spot', tFreeGift: 'Just save the seat', tRec: 'Recommended', tPif: 'Pay it forward', tWhole: 'A whole session', money: (a) => `€${a}`,
      iFree: 'You’re coming as someone else’s guest. That’s the whole point, and you’re welcome.',
      iFreeGift: 'Their spot is already a gift from everyone who came before. You’re just making sure they have a seat.',
      iFull: 'You’re funding a full clinic session on your own. Thank you.', iMany: (n) => `You’re funding ${n} clinic sessions. Thank you.`,
      iPart: (m) => `That’s about ${m} minutes of songs and company in the infusion room.`, iPeople: (p) => ` ${p} people giving like you fill a whole session.`,
      ctaFree: 'Send my ticket', ctaFreeGift: 'Send them their ticket', ctaPay: (a) => `Pay €${a} securely`,
      noteFree: 'Your ticket arrives by email in a minute or two.', notePay: 'Card, Apple Pay, Google Pay or SEPA on Stripe’s secure payment page.',
      errNeed: 'Please add your name and email so I can send your ticket.', errNeedGift: 'Please add their name and email so I can send them a ticket.',
      errFrom: 'Please add your own name and email too.', errGeneric: 'Something went wrong. Please try again.',
      backH: 'Can’t come after all?', backP: 'Your ticket email has a one-click link to give your spot back. If you need your money back, write to me before the evening and I’ll refund it, no questions asked.',
      giveH: 'Want to give without coming?', giveLink: 'You can pass it on here.', notTax: 'Ticket contributions are not tax-deductible donations.',
      missingH: 'This evening isn’t open right now.', missingLink: 'See upcoming evenings', locale: 'en-GB',
      share: 'Share this evening', copied: 'Link copied', left: (n) => `Only ${n} seat${n > 1 ? 's' : ''} left`,
      waitH: 'This evening is full', waitP: 'Leave your name and email. If someone gives their seat back, I’ll email you right away, and the first person to claim it gets it.',
      waitBtn: 'Put me on the waitlist', waitDone: 'You’re on the waitlist. I’ve sent you a short confirmation.'
    },
    de: {
      other: 'English', listEyebrow: 'Kommende Abende', listTitle: 'Sing mit uns', listEmpty: 'Gerade sind keine Abende offen. Schau bald wieder vorbei.',
      eyebrow: 'Gemeinsamer Chant-Abend', hosted: (c) => `Mit Nathan & ${c}`, times: (d, s) => `Einlass ${d}, Beginn ${s}`, tDoors: 'Einlass', tStart: 'Beginn', tEnd: 'Ende gegen', mapsTitle: 'In Karten öffnen',
      paidTitle: 'Dieser Abend ist schon bezahlt.',
      videoBtn: '▶ Im Video erklärt (gut eine Minute)',
      paidP1: 'Menschen, die vor dir da waren, haben gegeben, damit dieser Abend für dich frei ist. Wenn das Geld gerade knapp ist, reservier dir einen Platz und komm. Du bist willkommen, so wie du bist, und musst nichts erklären.',
      paidP2: 'Wenn du etwas übrig hast, hält dein Beitrag das Ganze am Laufen.',
      cost1: (c) => `Je ${c} € bezahlen eine Session von dreieinhalb Stunden in der `, clinic: 'Wolfgarten-Klinik',
      cost2: ' in Bonn. Dort begleite ich Frauen während ihrer Chemotherapie mit Gesang und Gespräch. Darin stecken auch meine Vorbereitung, die Fahrt und die Zahlungsgebühren.',
      progLabel: 'Nächste Session in der Klinik', progText: (r, c) => `${r} € von ${c} €`,
      funded: (n) => n === 1 ? 'Eine Session wurde schon von Menschen wie dir bezahlt.' : `${n} Sessions wurden schon von Menschen wie dir bezahlt.`,
      firstFilling: 'Die erste Session füllt sich gerade.',
      chooseH: 'Wähl, was passt', own: 'Oder ein eigener Betrag (€)',
      detailsH: 'Wohin soll ich dein Ticket schicken?', giftH: 'Für wen hältst du einen Platz frei?',
      name: 'Dein Name', email: 'E-Mail', theirName: 'Name der Person', theirEmail: 'E-Mail der Person (dorthin geht das Ticket)',
      spots: 'Wie viele Plätze?', fromName: 'Dein Name', fromEmail: 'Deine E-Mail (für deine Quittung)', giftNote: 'Ein paar Worte für die Person (freiwillig)',
      optin: 'Sag mir Bescheid, wenn ein Abend wie dieser in meine Nähe kommt', optinPaid: ', und wenn die Session stattfindet, die ich mitbezahlt habe', city: 'Stadt oder Postleitzahl (freiwillig)',
      tFree: 'Platz reservieren', tFreeGift: 'Nur den Platz freihalten', tRec: 'Empfohlen', tPif: 'Weitergeben', tWhole: 'Eine ganze Session', money: (a) => `${a} €`,
      iFree: 'Du kommst als Gast von jemand anderem. Genau darum geht es, und du bist willkommen.',
      iFreeGift: 'Der Platz ist schon ein Geschenk von allen, die vorher da waren. Du sorgst nur dafür, dass er frei bleibt.',
      iFull: 'Du ermöglichst ganz allein eine ganze Session in der Klinik. Danke.', iMany: (n) => `Du ermöglichst ${n} Sessions in der Klinik. Danke.`,
      iPart: (m) => `Das sind etwa ${m} Minuten Begleitung mit Gesang und Gespräch im Infusionsraum.`, iPeople: (p) => ` ${p} Menschen, die so geben wie du, machen eine ganze Session möglich.`,
      ctaFree: 'Ticket schicken', ctaFreeGift: 'Ticket an die Person schicken', ctaPay: (a) => `${a} € sicher bezahlen`,
      noteFree: 'Dein Ticket kommt in ein, zwei Minuten per E-Mail.', notePay: 'Karte, Apple Pay, Google Pay oder SEPA auf der sicheren Seite von Stripe.',
      errNeed: 'Bitte gib Name und E-Mail an, damit ich dein Ticket schicken kann.', errNeedGift: 'Bitte gib Name und E-Mail der Person an, damit ich ihr ein Ticket schicken kann.',
      errFrom: 'Bitte gib auch deinen eigenen Namen und deine E-Mail an.', errGeneric: 'Da ist etwas schiefgelaufen. Bitte versuch es noch einmal.',
      backH: 'Kannst du doch nicht kommen?', backP: 'In deiner Ticket-E-Mail ist ein Link, mit dem du deinen Platz mit einem Klick zurückgibst. Wenn du dein Geld zurück möchtest, schreib mir vor dem Abend, und ich erstatte es dir, ohne Fragen.',
      giveH: 'Möchtest du geben, ohne zu kommen?', giveLink: 'Hier kannst du es weitergeben.', notTax: 'Ticket-Beiträge sind keine steuerlich absetzbaren Spenden.',
      missingH: 'Dieser Abend ist gerade nicht offen.', missingLink: 'Kommende Abende ansehen', locale: 'de-DE',
      share: 'Einladung teilen', copied: 'Link kopiert', left: (n) => `Nur noch ${n} ${n > 1 ? 'Plätze' : 'Platz'} frei`,
      waitH: 'Dieser Abend ist ausgebucht', waitP: 'Hinterlass Namen und E-Mail. Wenn jemand seinen Platz zurückgibt, schreibe ich dir sofort, und wer zuerst zugreift, bekommt ihn.',
      waitBtn: 'Auf die Warteliste', waitDone: 'Du stehst auf der Warteliste. Ich habe dir eine kurze Bestätigung geschickt.'
    },
  };

  const site = await fetch('/events.json', { cache: 'no-store' }).then((r) => r.json());
  let cfg = site;
  try {
    const live = await fetch(site.apiBase + '/api/config').then((r) => { if (!r.ok) throw new Error(); return r.json(); });
    cfg = { ...site, ...live, apiBase: site.apiBase };
  } catch (e) {}
  const params = new URLSearchParams(location.search);
  const today = new Date().toISOString().slice(0, 10);
  const upcoming = (cfg.events || []).filter((e) => e.published && e.date >= today).sort((a, b) => a.date.localeCompare(b.date));
  const id = params.get('e');
  const gift = params.get('gift') === '1';
  const ev = id ? upcoming.find((e) => e.id === id) : null;
  const cost = cfg.sessionCost || 200;
  const mins = cfg.sessionMinutes || 210;
  let lang = ['de', 'en'].includes(params.get('lang')) ? params.get('lang')
    : ev && ev.lang ? ev.lang
    : (navigator.language || '').toLowerCase().startsWith('de') ? 'de' : 'en';
  const t = () => T[lang];
  const fmt = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString(t().locale, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });

  let amount = gift ? 0 : (ev && ev.recommended != null ? ev.recommended : 0);
  let progress = null;

  function renderStatic() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach((el) => { el.textContent = t()[el.dataset.i]; });
    $('langBtn').textContent = t().other;
    const vl = lang === 'de' ? 'de' : 'en', vid = $('explainer'), src = `/video/how-it-works-${vl}.mp4?v=2`;
    if (vid.getAttribute('src') !== src) { vid.pause(); vid.setAttribute('poster', `/video/how-it-works-${vl}.jpg?v=2`); vid.setAttribute('src', src); }
    $('giveLink').href = '/live/give.html' + (lang === 'de' ? '?lang=de' : '');
  }

  function renderList() {
    $('list').hidden = false;
    const box = $('listItems'); box.textContent = '';
    if (!upcoming.length) { const p = document.createElement('p'); p.textContent = t().listEmpty; box.append(p); return; }
    for (const e of upcoming) {
      const a = document.createElement('a');
      a.href = '?e=' + encodeURIComponent(e.id);
      const b = document.createElement('b'); b.textContent = e.title;
      a.append(b, document.createElement('br'), document.createTextNode(`${fmt(e.date)} · ${e.city}`));
      box.append(a);
    }
  }

  function renderProgress() {
    if (!progress) return;
    const p = progress;
    // Nothing raised yet: show no bar at all rather than an empty one.
    if (!p.sessionsFunded && !p.raisedTowardNext) { $('progress').hidden = true; return; }
    $('progress').hidden = false;
    $('progText').textContent = t().progText(p.raisedTowardNext, p.sessionCost);
    $('progFunded').textContent = p.sessionsFunded >= 1 ? t().funded(p.sessionsFunded) : t().firstFilling;
    requestAnimationFrame(() => { $('progBar').style.width = Math.min(100, Math.round(p.raisedTowardNext / p.sessionCost * 100)) + '%'; });
  }

  function renderEvent() {
    document.title = `${ev.title} · Agapic Chants`;
    $('event').hidden = false;
    $('title').textContent = ev.title;
    $('date').textContent = fmt(ev.date);
    const tm = $('times'); tm.textContent = '';
    [[t().tDoors, ev.doors], [t().tStart, ev.start], [t().tEnd, ev.end]].forEach(([k, v]) => {
      if (!v || (k === t().tDoors && v === ev.start)) return;
      const d = document.createElement('div'); d.textContent = `${k} ${v}`; tm.append(d);
    });
    const placeText = [ev.venue, ev.address, [ev.postcode, ev.city].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    const mapsHref = /^https:\/\//.test(ev.mapsUrl || '') ? ev.mapsUrl
      : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([ev.venue, ev.address, ev.postcode, ev.city].filter(Boolean).join(' '));
    const pl = $('place'); pl.textContent = '';
    const pa = document.createElement('a'); pa.href = mapsHref; pa.target = '_blank'; pa.rel = 'noopener'; pa.title = t().mapsTitle; pa.textContent = placeText;
    pl.append(pa);
    $('blurb').textContent = (lang === 'de' && ev.blurbDe) || ev.blurb || '';
    $('hosts').hidden = !ev.cohost;
    if (ev.cohost) $('hosts').textContent = t().hosted(ev.cohost);
    const cl = $('costline'); cl.textContent = '';
    cl.append(t().cost1(cost));
    if (cfg.clinicUrl) {
      const a = document.createElement('a');
      a.href = cfg.clinicUrl; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t().clinic;
      cl.append(a);
    } else cl.append(t().clinic);
    cl.append(t().cost2);
    const full = ev.spotsLeft === 0;
    $('form').hidden = full;
    $('waitBox').hidden = !full;
    $('seatsLeft').hidden = !(ev.spotsLeft > 0 && ev.spotsLeft <= 5);
    if (ev.spotsLeft > 0) $('seatsLeft').textContent = t().left(ev.spotsLeft);
    $('spots').max = Math.min(ev.maxSpotsPerOrder || 4, ev.spotsLeft || 99);
    $('detailsHead').textContent = gift ? t().giftH : t().detailsH;
    $('nameLabel').textContent = gift ? t().theirName : t().name;
    $('emailLabel').textContent = gift ? t().theirEmail : t().email;
    $('spotsRow').hidden = gift;
    $('giftFields').hidden = !gift;
    const rec = ev.recommended;
    const tiers = [{ amt: 0, sub: gift ? t().tFreeGift : t().tFree }]
      .concat((ev.tiers || []).map((a) => ({ amt: a, sub: a === rec ? t().tRec : t().tPif })))
      .concat([{ amt: cost, sub: t().tWhole }]);
    const box = $('tiers'); box.textContent = '';
    for (const x of tiers) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tier'; b.dataset.amt = x.amt;
      const s = document.createElement('strong'); s.textContent = t().money(x.amt);
      const sp = document.createElement('span'); sp.textContent = x.sub;
      b.append(s, sp); box.append(b);
    }
    update();
    renderProgress();
  }

  function update() {
    document.querySelectorAll('.tier').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.amt) === amount && !$('custom').value)));
    const free = amount === 0;
    const people = Math.ceil(cost / amount);
    $('impact').textContent = free ? (gift ? t().iFreeGift : t().iFree)
      : amount >= cost ? (amount >= cost * 2 ? t().iMany(Math.floor(amount / cost)) : t().iFull)
      : t().iPart(Math.max(1, Math.round(amount / cost * mins))) + (people <= 20 ? t().iPeople(people) : '');
    $('cta').textContent = free ? (gift ? t().ctaFreeGift : t().ctaFree) : t().ctaPay(amount);
    $('ctaNote').textContent = free ? t().noteFree : t().notePay;

  }

  function render() {
    renderStatic();
    if (!id) return renderList();
    if (!ev) { $('missing').hidden = false; return; }
    renderEvent();
  }

  $('langBtn').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; render(); });
  render();
  if (!ev) return;

  fetch(cfg.apiBase + '/api/progress').then((r) => r.json()).then((p) => { progress = p; renderProgress(); }).catch(() => {});

  $('shareBtn').addEventListener('click', async () => {
    const url = `${cfg.apiBase}/e/${encodeURIComponent(ev.id)}?lang=${lang}`;
    if (navigator.share) { try { await navigator.share({ title: ev.title, url }); } catch (x) {} return; }
    try { await navigator.clipboard.writeText(url); $('shareBtn').textContent = t().copied; } catch (x) { prompt(t().share, url); }
  });

  $('wBtn').addEventListener('click', async () => {
    const err = $('wError'); err.style.display = 'none';
    const body = { eventId: ev.id, name: $('wName').value.trim(), email: $('wEmail').value.trim(), lang };
    if (!body.name || !body.email) { err.textContent = t().errNeed; err.style.display = 'block'; return; }
    $('wBtn').disabled = true;
    try {
      const res = await fetch(cfg.apiBase + '/api/waitlist', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || t().errGeneric);
      $('wDone').hidden = false; $('wBtn').hidden = true;
    } catch (x) { err.textContent = x.message || t().errGeneric; err.style.display = 'block'; $('wBtn').disabled = false; }
  });

  $('tiers').addEventListener('click', (e) => {
    const b = e.target.closest('.tier'); if (!b) return;
    amount = Number(b.dataset.amt); $('custom').value = ''; update();
  });
  $('custom').addEventListener('input', () => { amount = Math.max(0, Math.round(Number($('custom').value) || 0)); update(); });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = $('error'); err.style.display = 'none';
    const show = (m) => { err.textContent = m; err.style.display = 'block'; };
    const body = {
      eventId: ev.id, amount, lang,
      name: $('name').value.trim(), email: $('email').value.trim(),
      spots: Number($('spots').value) || 1,
      optIn: false, city: '',
      gift, fromName: $('fromName').value.trim(), fromEmail: $('fromEmail').value.trim(), note: $('note').value.trim(),
    };
    if (!body.name || !body.email) return show(gift ? t().errNeedGift : t().errNeed);
    if (gift && (!body.fromName || !body.fromEmail)) return show(t().errFrom);
    $('cta').disabled = true;
    try {
      const res = await fetch(cfg.apiBase + (amount === 0 ? '/api/rsvp' : '/api/checkout'), {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      });
      const data = await res.json();
      if (res.status === 409) { ev.spotsLeft = 0; renderEvent(); $('waitBox').scrollIntoView({ behavior: 'smooth' }); return; }
      if (!res.ok) throw new Error(data.error || t().errGeneric);
      if (data.url) { location.href = data.url; return; }
      // Free spot: hand the ticket details to the thank-you page without putting names in the address.
      try { sessionStorage.setItem('acTicket', JSON.stringify({ e: ev.id, t: data.ticket, n: data.name, s: data.spots, g: !!data.gift })); } catch (x) {}
      location.href = '/live/thanks.html?free=1&lang=' + lang;
    } catch (x) {
      show(x.message || t().errGeneric); $('cta').disabled = false;
    }
  });
})();
</script>
</body>
</html>
