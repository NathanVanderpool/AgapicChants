<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass it on · Agapic Chants</title>
<link rel="stylesheet" href="/fonts/jost.css">
<style>
  :root{--cream:#f4e7d4;--card:#fbf3e8;--terra:#d2684f;--terra-dark:#b04c35;--terra-deeper:#8f3a27;--ink:#2a1f14;--ink-soft:#5a4535;--rule:rgba(210,104,79,0.2);--field:rgba(176,76,53,0.35)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Jost,Futura,'Century Gothic',sans-serif;font-size:17px;line-height:1.5}
  a{color:var(--terra-dark)}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 56px}
  header{display:flex;justify-content:space-between;align-items:center}
  header img{width:60px;height:60px;display:block}
  .lang{height:44px;padding:0 14px;border-radius:10px;border:1.5px solid var(--field);background:transparent;font:inherit;font-size:16px;color:var(--ink);cursor:pointer}
  h1{margin:24px 0 12px;font-weight:500;font-size:clamp(28px,7vw,38px);line-height:1.1}
  p{margin:0 0 12px}
  .tiers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
  .tier{min-height:76px;padding:12px;border-radius:14px;text-align:left;font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:2px solid rgba(210,104,79,.25)}
  .tier strong{display:block;font-size:24px;font-weight:500} .tier span{display:block;font-size:14px}
  .tier[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
  label{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:500;margin-top:14px}
  input{height:48px;border:1.5px solid var(--field);border-radius:12px;padding:0 14px;font:inherit;font-weight:400;background:var(--card);color:var(--ink)}
  input:focus,button:focus-visible{outline:3px solid var(--terra);outline-offset:2px}
  .impact{margin-top:14px;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:12px}
  .cta{margin-top:20px;width:100%;height:56px;border:none;border-radius:14px;background:var(--terra-dark);color:#fff;font:inherit;font-size:18px;font-weight:500;cursor:pointer}
  .cta[disabled]{opacity:.6;cursor:wait}
  .note{font-size:14px;color:var(--ink-soft);text-align:center;margin-top:10px}
  .error{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f6d6cc;color:#5c1f12;display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="/"><img src="/images/agapic-chants-logo.png" alt="Agapic Chants"></a>
    <button class="lang" id="langBtn" type="button"></button>
  </header>
  <h1 data-t="title"></h1>
  <p data-t="intro"></p>
  <div class="tiers" id="tiers"></div>
  <label><span data-t="own"></span><input type="number" id="custom" min="1" step="1" inputmode="numeric" placeholder="€"></label>
  <div class="impact" id="impact"></div>
  <label><span data-t="name"></span><input type="text" id="name" autocomplete="name"></label>
  <div class="error" id="error" role="alert"></div>
  <button class="cta" id="cta" type="button"></button>
  <p class="note" data-t="note"></p>
</div>
<footer style="max-width:560px;margin:0 auto;padding:0 16px 40px;font-size:14px;display:flex;gap:16px"><a href="/impressum.html" style="color:#5a4535">Impressum</a><a href="/datenschutz.html" style="color:#5a4535">Datenschutz</a></footer>
<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const cfg = await fetch('/events.json', { cache: 'no-store' }).then((r) => r.json());
  const cost = cfg.sessionCost || 200, mins = cfg.sessionMinutes || 210;
  const T = {
    en: { title: 'Pass it on', intro: `Every €${cost} pays for a 3.5-hour session at the Wolfgarten clinic in Bonn, where I keep women company during their chemotherapy infusions with songs and conversation. Give whatever feels right.`,
      own: 'Or your own amount (€)', name: 'Your name (optional, so I can thank you)', note: 'Card, Apple Pay, Google Pay or SEPA on Stripe’s secure page. Stripe asks for your email so I can thank you and tell you when the session happens. This is not a tax-deductible donation.',
      full: 'You’re funding a full session. Thank you.', part: (m) => `That’s about ${m} minutes of songs and company in the infusion room.`, pay: (a) => `Give €${a}`, other: 'Deutsch', whole: 'A whole session', pick: 'Pass it on', err: 'Please choose an amount.' },
    de: { title: 'Weitergeben', intro: `Jede ${cost} € ermöglichen eine Session von dreieinhalb Stunden in der Wolfgarten-Klinik in Bonn. Dort begleite ich Frauen während ihrer Chemotherapie mit Gesang und Gespräch. Geben Sie, was sich für Sie richtig anfühlt.`,
      own: 'Oder ein eigener Betrag (€)', name: 'Ihr Name (freiwillig, damit ich Ihnen danken kann)', note: 'Karte, Apple Pay, Google Pay oder SEPA über die sichere Seite von Stripe. Stripe fragt nach Ihrer E-Mail, damit ich Ihnen danken und Bescheid geben kann, wenn die Session stattgefunden hat. Dies ist keine steuerlich absetzbare Spende.',
      full: 'Sie ermöglichen eine ganze Session. Danke.', part: (m) => `Das sind etwa ${m} Minuten Begleitung mit Gesang und Gespräch.`, pay: (a) => `${a} € geben`, other: 'English', whole: 'Eine ganze Session', pick: 'Weitergeben', err: 'Bitte wählen Sie einen Betrag.' },
  };
  let lang = new URLSearchParams(location.search).get('lang') === 'de' ? 'de' : 'en';
  let amount = 25;
  const tiers = [15, 25, 50, cost];

  function render() {
    const t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
    $('langBtn').textContent = t.other;
    $('tiers').innerHTML = tiers.map((a) => `<button type="button" class="tier" data-amt="${a}"><strong>${lang === 'de' ? a + ' €' : '€' + a}</strong><span>${a === cost ? t.whole : t.pick}</span></button>`).join('');
    update();
  }
  function update() {
    const t = T[lang];
    document.querySelectorAll('.tier').forEach((b) => b.setAttribute('aria-pressed', String(Number(b.dataset.amt) === amount && !$('custom').value)));
    $('impact').textContent = amount >= cost ? t.full : amount > 0 ? t.part(Math.max(1, Math.round(amount / cost * mins))) : '';
    $('cta').textContent = amount > 0 ? t.pay(amount) : t.pick;
  }
  $('tiers').addEventListener('click', (e) => { const b = e.target.closest('.tier'); if (!b) return; amount = Number(b.dataset.amt); $('custom').value = ''; update(); });
  $('custom').addEventListener('input', () => { amount = Math.max(0, Math.round(Number($('custom').value) || 0)); update(); });
  $('langBtn').addEventListener('click', () => { lang = lang === 'de' ? 'en' : 'de'; render(); });
  render();

  $('cta').addEventListener('click', async () => {
    const err = $('error'); err.style.display = 'none';
    if (!(amount >= 1)) { err.textContent = T[lang].err; err.style.display = 'block'; return; }
    $('cta').disabled = true;
    try {
      const r = await fetch(cfg.apiBase + '/api/give', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ amount, name: $('name').value.trim(), lang }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      location.href = d.url;
    } catch (x) { err.textContent = x.message || 'Something went wrong.'; err.style.display = 'block'; $('cta').disabled = false; }
  });
})();
</script>
</body>
</html>
